[loggers]
keys = root, uvicorn, uvicorn_error, uvicorn_access, loon

[handlers]
keys = default, access

[formatters]
keys = default, access

[logger_root]
level = INFO
handlers = default

[logger_uvicorn]
level = INFO
handlers = default
propagate = 0
qualname = uvicorn

[logger_uvicorn_error]
level = INFO
handlers =
propagate = 1
qualname = uvicorn.error

[logger_uvicorn_access]
level = INFO
handlers = access
propagate = 0
qualname = uvicorn.access

[logger_loon]
level = INFO
handlers = default
propagate = 0
qualname = loon

[handler_default]
class = StreamHandler
level = INFO
formatter = default
args = (sys.stderr,)

[handler_access]
class = StreamHandler
level = INFO
formatter = access
args = (sys.stdout,)

[formatter_default]
format = %(asctime)s [%(levelname)s] %(message)s

[formatter_access]
class = uvicorn.logging.AccessFormatter
format = %(asctime)s [%(levelname)s] %(client_addr)s - "%(request_line)s" %(status_code)s
